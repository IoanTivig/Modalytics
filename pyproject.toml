[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modalytics"
version = "0.1.0"
description = "Open-source modular multi-modal imaging analysis platform (WSI, quantitative phase, brightfield)."
readme = "README.md"
requires-python = ">=3.11"
license = "LGPL-3.0-or-later"
license-files = ["COPYING", "COPYING.LESSER", "NOTICE"]
authors = [{ name = "Ioan Cristian Tivig" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=2.0",
    "PySide6>=6.8",
    "pygfx>=0.17",
    "rendercanvas>=2.7",
    "wgpu>=0.32",
    "zarr>=3.0",
    "numcodecs>=0.15",
    "mapbox_earcut>=1.0",
    "shapely>=2.0",
    "qtawesome>=1.3",
    "onnxruntime-directml>=1.20; sys_platform == 'win32'",
    "onnxruntime>=1.20; sys_platform != 'win32'",
    "opencv-python-headless>=4.8",
    "tifffile>=2024.1",              # slides read in place (SVS, pyramidal TIFF / OME-TIFF), TIFF images
    "imagecodecs>=2024.1",           # decodes the JPEG / JPEG 2000 tiles of slide files
    "Pillow>=10.0",                  # image sizes without decoding (large-image check)
    "scipy>=1.11",
    "scikit-image>=0.22",
    "scikit-learn>=1.4",             # Training: the trained classifier (random forest); not needed to classify
    "PyYAML>=6.0",
    "XlsxWriter>=3.1",               # Training: results saved as Excel workbooks with native charts (XLSX…)
    "safetensors>=0.4",              # model weights read without PyTorch (Evaluate: a model's size)
    "pip>=23.1",                     # Settings › Parameters › Libraries installs parameter libraries with it
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# The full edition: training segmentation models (PyTorch; the analysis edition runs models with ONNX Runtime)
training = [
    "torch>=2.7",
    "segmentation-models-pytorch>=0.5",
    "onnx>=1.16",                    # exports trained models for the analysis edition (ONNX Runtime)
]

# Building the installer (packaging/build.py): never installed with Modalytics, only into the build environment
[dependency-groups]
build = ["pyinstaller>=6.11"]

[project.scripts]
modalytics = "modalytics.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/modalytics"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# PyTorch with CUDA (NVIDIA) on Windows and Linux; elsewhere (macOS) the default build from PyPI
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
