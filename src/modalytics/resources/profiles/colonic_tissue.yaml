# Modalytics profile — edit in Settings › Profiles, or here by hand
format: modalytics-profile
format_version: 1
name: Colonic tissue
kind: tissue
description: 'Colon biopsies scanned as whole slides, with DHM phase maps of the same sections. Glands are segmented,
  measured and graded: low-grade dysplasia (normal tissue included, as biopsies are not taken from healthy people)
  or high-grade dysplasia.'
revision: 2
images:
- wsi
- phase
classes:
  Gland:
    color: '#33cc66'
    subgroups:
      Low grade dysplasia: '#facc26'
      High grade dysplasia: '#eb4040'
aliases:
  Gland:
    Normal: Low grade dysplasia
    Dysplasia low grade: Low grade dysplasia
    Dysplasia high grade: High grade dysplasia
segmentation:
  Gland:
    wsi: wsi_effnetb3_L00_gland_01
    phase: unet_efficientnet_b0__imagenet_micronet
processing:
  wsi:
  - name: OD map
    steps:
    - step: od:od_map
      options:
        background: Estimated from the image
    measure: true
