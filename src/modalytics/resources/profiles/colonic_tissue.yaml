    kind: ranges
    group: Gland
    grades:
    - Low grade dysplasia
    - High grade dysplasia
    note: 'Ranges rule of the validation article: training set ''Colonic Glands Simplified V2'' (14 projects, 421 glands);
      leave-one-project-out balanced accuracy 73 % (60–84); evaluation 83 %, test 81 %'
    rules:
    - grade: High grade dysplasia
      combine: any
      conditions:
